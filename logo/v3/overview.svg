<foreignObject/></g><text x="800" y="660" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">v1의 둥근 말풍선 외곽선에서 꼬리만 뾰족하게 다듬고, 안의 장식은 모두</text><text x="800" y="686" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">덜어냈습니다. 커서 하나만 남겨 대화가 이어지는 순간을 표현합니다.</text></svg>