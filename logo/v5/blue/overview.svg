<foreignObject/></g><text x="800" y="660" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">외곽선을 없애고 커서만 중심에 둔, 가장 단순한 버전입니다. 커서 윗부분의</text><text x="800" y="686" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">사선 컷 하나가 유일한 샤프 디테일입니다.</text></svg>