<text x="760" y="70" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="30" font-weight="700" fill="#F5F5F7">01 Open Frame</text>
<foreignObject/></g><text x="800" y="200" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">꼬리를 없애고, 외곽선의 왼쪽 아래 모서리를 열어 두었습니다. 닫히지 않은</text><text x="800" y="226" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">틀은 '아직 생성 중인 답'을 뜻하고, 잘린 획 끝 두 곳이 날카로운</text><text x="800" y="252" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">디테일입니다.</text><g transform="translate(40 320)">
