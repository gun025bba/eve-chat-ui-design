<foreignObject/></g><text x="800" y="430" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">말풍선을 대각선의 두 모서리 괄호로만 남겼습니다. 가운데 커서에 초점이</text><text x="800" y="456" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">모이는 구도로, 대화 앱보다는 생각하는 도구라는 인상을 줍니다.</text><g transform="translate(40 550)">
