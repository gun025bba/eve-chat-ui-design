<foreignObject/></g><text x="800" y="660" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">l 획의 윗부분을 사선으로 잘라내고 점을 마름모로 바꿨습니다.</text><text x="800" y="686" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">'local'과 이름 첫 글자라는 의미는 그대로 두고 칼날 같은 인상을</text><text x="800" y="712" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">더했습니다.</text><g transform="translate(40 780)">
