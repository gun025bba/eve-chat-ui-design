<foreignObject/></g><text x="800" y="430" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">말풍선을 직선과 사선 꼬리로 다시 그리고, 커서를 날카로운 블록으로</text><text x="800" y="456" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">바꿨습니다. 답이 스트리밍되는 순간을 단단한 인상으로 보여줍니다.</text><g transform="translate(40 550)">
