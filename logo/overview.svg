<foreignObject/></g><text x="800" y="1120" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2">채워진 반원(답)과 열린 반원(질문)이 마주 보며 하나의 원을 이룹니다.</text><text x="800" y="1146" font-family="Noto Sans CJK KR, Noto Sans KR, Inter, 'SF Pro Display', system-ui, sans-serif" font-size="17" fill="#AEAEB2"> 묻고 답하는 대화의 리듬을 가장 단순한 기하로 표현했습니다.</text></svg>