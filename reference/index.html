<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="styles.css">
<title>LLM Chat</title>
</head>
<body>
<div id="app">
  <aside id="drawer" aria-label="대화 목록">
    <div class="drawer-head"><h2>대화</h2>
      <button id="newChat" class="icon" aria-label="새 대화"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <ul id="convList"></ul>
    <div class="drawer-foot"><button id="openSettings" class="row-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button></div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon" aria-label="메뉴"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div id="titleWrap"><div id="title">새 대화</div><small id="modelName"></small></div>
      <button id="newChat2" class="icon" aria-label="새 대화"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </header>
    <div id="messages" aria-live="polite"></div>
    <button id="toBottom" aria-label="맨 아래로"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <form id="composer">
      <div class="field">
        <textarea id="input" rows="1" placeholder="메시지" enterkeyhint="send"></textarea>
        <button id="sendBtn" type="submit" class="send" aria-label="전송" disabled>
          <svg class="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span class="i-stop"></span></button>
      </div>
    </form>
  </main>
</div>
<dialog id="settings">
  <form id="settingsForm" method="dialog">
    <div class="grabber"></div>
    <div class="sheet-head"><h2>설정</h2><button type="button" id="cancelSettings" class="text-btn">닫기</button></div>
    <p class="sec">연결</p>
    <div class="group">
      <label>Base URL<input id="sBase" type="url" placeholder="같은 서버" autocapitalize="off" spellcheck="false"></label>
      <label>API Key<input id="sKey" type="password" autocomplete="off" placeholder="선택"></label>
      <label>모델<input id="sModel" placeholder="기본값" autocapitalize="off" spellcheck="false"></label>
    </div>
    <p class="sec">대화</p>
    <div class="group"><label class="col">시스템 프롬프트<textarea id="sSystem" rows="3"></textarea></label></div>
    <div class="group">
      <label class="sw">Mock 모드 (백엔드 없이 데모)<input id="sMock" type="checkbox" switch></label>
      <label class="sw">생각 과정 기본 펼치기<input id="sShowThink" type="checkbox" switch></label>
    </div>
    <button type="submit" class="primary">저장</button>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
